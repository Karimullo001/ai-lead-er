services:
  - type: web
    name: agentos-api-v2
    runtime: python
    plan: free
    buildCommand: python repair_bootstrap.py && python bootstrap_agentos.py . && python upgrade_agentos.py && pip install -e .
    startCommand: >-
      python -c 'from pathlib import Path; p=Path("api/main.py"); s=p.read_text(); s=s.replace("STATE: Dict[str, Any] = {}", "STATE: Dict[str, Any] = {}\\nHOSTED_RUNTIME: Dict[str, Any] = {}", 1); old="    STATE.update(dict(tm=tm, queue=q, router=router, cost=cost, redis_url=redis_url))\\n    log.info("API ready with providers: %s", router.available_providers())\\n    yield\\n    await q.close(); await tm.close()\\n    STATE.clear()"; new="    STATE.update(dict(tm=tm, queue=q, router=router, cost=cost, redis_url=redis_url))\\n    log.info("API ready with providers: %s", router.available_providers())\\n    if os.getenv("EMBEDDED_RUNTIME", "true").lower() == "true":\\n        from hosted_runtime import start_hosted_runtime\\n        HOSTED_RUNTIME.update(await start_hosted_runtime())\\n    yield\\n    if HOSTED_RUNTIME:\\n        from hosted_runtime import stop_hosted_runtime\\n        await stop_hosted_runtime(HOSTED_RUNTIME)\\n        HOSTED_RUNTIME.clear()\\n    await q.close(); await tm.close()\\n    STATE.clear()"; s=s.replace(old,new,1); p.write_text(s)'; uvicorn api.main:app --host 0.0.0.0 --port $PORT
    
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agentos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agentos-redis
          property: connectionString
      - key: EMBEDDED_RUNTIME
        value: "true"
      - key: AGENTOS_API_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false

  - type: keyvalue
    name: agentos-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: agentos-db
    plan: free
    databaseName: agentos
    user: agentos
